
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B3558" />
  <title>NutriPilot Pilot v0.3 – Fachlich fundierter Konzeptprototyp</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{
      --navy:#0B3558;--navy2:#114E78;--blue:#2874D0;--cyan:#31A7C5;
      --green:#27A46B;--green-soft:#EAF7F0;--amber:#E99A18;--amber-soft:#FFF5E0;
      --red:#D94D4D;--red-soft:#FFF0F0;--purple:#7257D8;--purple-soft:#F2EEFF;
      --ink:#172233;--muted:#6B778A;--line:#E5EAF1;--bg:#F3F6FA;--card:#FFFFFF;
      --shadow:0 16px 40px rgba(24,48,78,.09);--radius:16px
    }
    *{box-sizing:border-box}
    html,body,#root{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
    .sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;background:linear-gradient(180deg,#0A3254 0%,#0A2D4A 58%,#0D3A61 100%);color:#EAF2F8;display:flex;flex-direction:column}
    .brand{display:flex;gap:12px;align-items:center;padding:0 8px;margin-bottom:24px}
    .brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#25B780,#3483D5);display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 8px 18px rgba(0,0,0,.15)}
    .brand b{font-size:17px}.brand small{display:block;color:#AFC7D9;margin-top:2px}
    .nav-section{margin:18px 10px 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7FA2BD;font-weight:700}
    .nav-btn{width:100%;border:0;background:transparent;color:#DCE9F2;border-radius:11px;padding:11px 12px;display:flex;gap:11px;align-items:center;text-align:left;margin:2px 0;transition:.2s}
    .nav-btn:hover,.nav-btn.active{background:linear-gradient(90deg,#165D92,#174F7A);color:#fff;transform:translateX(2px)}
    .nav-icon{width:22px;text-align:center;font-size:17px}
    .profile{margin-top:auto;border-top:1px solid rgba(255,255,255,.13);padding:18px 7px 4px;display:flex;gap:10px;align-items:center}
    .avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#DFB18C,#8D5F48);color:#fff;font-weight:800}
    .profile small{display:block;color:#AFC7D9;margin-top:2px}
    .shell{min-width:0}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px}
    .greeting h1{font-size:22px;margin:0}.greeting p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .top-actions{display:flex;gap:9px;align-items:center}
    .search{border:1px solid var(--line);background:#F9FBFD;border-radius:11px;padding:10px 12px;min-width:230px}
    .btn{border:1px solid var(--line);background:#fff;color:#26364A;border-radius:10px;padding:10px 13px;font-weight:600;transition:.18s}
    .btn:hover{box-shadow:0 7px 18px rgba(26,48,76,.10);transform:translateY(-1px)}
    .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
    .btn.soft{background:#EFF5FB;border-color:#DCE9F4;color:#164C77}
    .content{padding:22px}
    .page{animation:fade .22s ease}
    @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .hero{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;margin-bottom:18px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 5px 16px rgba(24,48,78,.045)}
    .card-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .card-head h3{margin:0;font-size:15px}.card-body{padding:17px}
    .welcome{padding:24px;background:linear-gradient(135deg,#FFFFFF 0%,#EFF6FC 100%)}
    .welcome h2{margin:0 0 8px;font-size:28px}.welcome p{margin:0;color:var(--muted);line-height:1.6}
    .summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:20px}
    .summary-card{padding:15px;border-radius:13px;background:#fff;border:1px solid var(--line)}
    .summary-card strong{display:block;font-size:25px;margin-bottom:4px}.summary-card small{color:var(--muted)}
    .copilot-card{background:linear-gradient(155deg,#102F55,#164C78);color:#fff;border:0}
    .copilot-card .card-head{border-bottom:1px solid rgba(255,255,255,.12)}
    .copilot-card p,.copilot-card small{color:#C6D9E8}
    .copilot-item{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.1);display:flex;gap:10px}
    .copilot-item:last-child{border-bottom:0}
    .rank{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
    .grid-2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,.8fr);gap:18px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
    .priority-list{display:grid;gap:10px}
    .patient-row{display:grid;grid-template-columns:46px minmax(0,1fr) 120px 100px 34px;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;transition:.18s}
    .patient-row:hover{box-shadow:0 8px 22px rgba(30,53,82,.08);transform:translateY(-1px)}
    .mini-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#EEF2F6,#CDD6E0);display:grid;place-items:center;font-size:21px}
    .patient-row b{display:block}.patient-row small{color:var(--muted)}
    .priority{font-weight:800;font-size:12px;padding:5px 9px;border-radius:20px;text-align:center}
    .high{background:var(--red-soft);color:#B63838}.medium{background:var(--amber-soft);color:#A36307}.low{background:var(--green-soft);color:#287A50}
    .score{font-size:18px;font-weight:800;color:var(--navy)}
    .station-grid{display:grid;gap:10px}
    .station{padding:12px;border:1px solid var(--line);border-radius:12px}
    .station-top{display:flex;justify-content:space-between;font-size:13px}.bar{height:7px;background:#EDF1F5;border-radius:10px;margin-top:9px;overflow:hidden}.bar span{height:100%;display:block;border-radius:10px;background:linear-gradient(90deg,#30A779,#43B98A)}
    .patient-header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:16px}
    .patient-title{display:flex;align-items:center;gap:14px}.patient-photo{width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,#E8EDF2,#CBD4DD);display:grid;place-items:center;font-size:31px}
    .patient-title h2{margin:0}.patient-title p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .workspace{display:grid;grid-template-columns:205px minmax(0,1fr) 315px;gap:16px}
    .journey{padding:15px}.journey-step{position:relative;padding:10px 10px 10px 32px;font-size:13px;border-radius:9px;margin:3px 0}
    .journey-step:before{content:"";position:absolute;left:10px;top:14px;width:10px;height:10px;border-radius:50%;background:#C9D3DE}
    .journey-step.done:before{background:var(--green)}.journey-step.current{background:#EEF5FC;color:#13558A;font-weight:800}.journey-step.current:before{background:var(--blue)}
    .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
    .metric{padding:14px;border:1px solid var(--line);border-radius:12px}.metric strong{font-size:21px;display:block}.metric small{color:var(--muted)}
    .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:0 15px}
    .tab{border:0;background:transparent;padding:13px 10px;color:var(--muted);font-weight:700;border-bottom:3px solid transparent}
    .tab.active{color:var(--blue);border-color:var(--blue)}
    .timeline{border-left:3px solid #D9E5F0;margin-left:11px;padding-left:20px}.event{position:relative;margin:0 0 20px}.event:before{content:"";position:absolute;left:-27px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 1px #BBD0E4}.event p{margin:5px 0;color:var(--muted);font-size:13px}
    .copilot-panel{position:sticky;top:92px;align-self:start}.insight{padding:12px;border-radius:12px;background:#F7FAFD;border:1px solid var(--line);margin-bottom:10px}.insight b{font-size:13px}.insight p{font-size:12px;color:var(--muted);line-height:1.5;margin:5px 0 0}
    .criterion-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.criterion-block{border:1px solid var(--line);border-radius:14px;padding:14px}.criterion-block h4{margin:0 0 10px}
    .criterion{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #EDF1F4;cursor:pointer}.criterion:last-child{border-bottom:0}.check{width:25px;height:25px;border-radius:50%;border:1.5px solid #B9C5D2;display:grid;place-items:center;color:#fff;flex:0 0 auto}.criterion.on .check{background:var(--green);border-color:var(--green)}.criterion small{display:block;color:var(--muted);margin-top:3px}
    .result{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;padding:15px;border-radius:13px;background:var(--amber-soft);border:1px solid #F1D79B;margin-top:14px}.result h3{margin:0 0 5px;color:#B86700}.result p{margin:0;color:#805719;font-size:13px}
    .segments{display:flex;border:1px solid #D8DEE7;border-radius:10px;overflow:hidden;background:#fff}.segments button{flex:1;border:0;background:#fff;padding:9px}.segments button.active{background:var(--amber);color:#fff;font-weight:800}
    .table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}
    .badge{display:inline-block;padding:4px 9px;border-radius:16px;font-size:11px;font-weight:800}.green{background:var(--green-soft);color:#277850}.purple{background:var(--purple-soft);color:#5D47B8}.orange{background:var(--amber-soft);color:#A45F03}
    .quality-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.quality-kpi{padding:18px}.quality-kpi strong{font-size:29px;display:block;margin-bottom:4px}.quality-kpi small{color:var(--muted)}
    .chart{height:190px;position:relative}.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.heat{height:32px;border-radius:8px;background:#EAF5EF}.heat:nth-child(5n){background:#FFDDA6}.heat:nth-child(9n){background:#F5B7B7}
    .guideline{padding:14px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px}.guideline h4{margin:0 0 7px}.guideline p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
    .modal{position:fixed;inset:0;background:rgba(7,24,42,.48);display:grid;place-items:center;z-index:80;padding:20px}.modal-card{width:min(720px,95vw);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:21px}.modal-card h2{margin:0 0 13px}.modal-card textarea{width:100%;min-height:280px;border:1px solid var(--line);border-radius:12px;padding:13px;line-height:1.6}
    .toast{position:fixed;right:22px;bottom:22px;background:#103A60;color:#fff;padding:12px 16px;border-radius:11px;box-shadow:var(--shadow);z-index:90}

    .clinical-banner{margin-bottom:16px;padding:12px 15px;border:1px solid #D8E6F2;border-radius:13px;background:#F7FBFE;display:flex;justify-content:space-between;gap:14px;align-items:center}
    .clinical-banner b{font-size:13px}.clinical-banner small{display:block;color:var(--muted);margin-top:3px;line-height:1.45}
    .source-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:20px;background:#EEF5FB;color:#1B5887;font-size:11px;font-weight:800}
    .state-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #EDF1F4}
    .state-controls{display:flex;gap:5px}
    .state-controls button{border:1px solid #D8E0E8;background:#fff;padding:6px 8px;border-radius:8px;font-size:10px;color:#627083}
    .state-controls button.on-yes{background:var(--green-soft);border-color:#BFE4D0;color:#26774E;font-weight:800}
    .state-controls button.on-no{background:#F2F4F7;border-color:#D8DEE6;color:#4E5B6B;font-weight:800}
    .state-controls button.on-unknown{background:var(--amber-soft);border-color:#F0D394;color:#9B5A04;font-weight:800}
    .rule-box{margin-top:12px;padding:12px;border-radius:12px;background:#F8FAFC;border:1px solid var(--line);font-size:12px;line-height:1.55}
    .rule-box code{background:#EAF0F6;padding:2px 5px;border-radius:5px}
    .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:8px}
    .legend span{display:flex;align-items:center;gap:6px}
    .legend i{display:inline-block;width:18px;height:3px;border-radius:4px}
    .axis-label{font-size:10px;fill:#697386}
    .scope-card{padding:14px;border-left:4px solid var(--blue);background:#F7FBFE;border-radius:10px;font-size:12px;line-height:1.55}

    .mobile-nav{display:none}
    @media(max-width:1180px){.app{grid-template-columns:82px minmax(0,1fr)}.brand div:last-child,.nav-btn span:last-child,.nav-section,.profile div:last-child{display:none}.sidebar{padding:20px 12px}.brand,.nav-btn,.profile{justify-content:center}.workspace{grid-template-columns:170px minmax(0,1fr)}.copilot-panel{grid-column:1/-1;position:static}.hero{grid-template-columns:1fr}.summary-row{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:820px){.app{display:block}.sidebar{display:none}.topbar{position:static;padding:14px}.search{display:none}.content{padding:14px 14px 82px}.grid-2,.grid-3,.workspace,.criterion-grid,.result,.quality-grid,.metric-grid{grid-template-columns:1fr}.summary-row{grid-template-columns:1fr 1fr}.patient-row{grid-template-columns:42px minmax(0,1fr) 86px}.patient-row .score,.patient-row button{display:none}.journey{display:flex;overflow:auto;gap:6px}.journey-step{min-width:150px}.mobile-nav{display:flex;position:fixed;left:10px;right:10px;bottom:10px;background:#0A3558;color:#fff;border-radius:15px;padding:8px;z-index:40;justify-content:space-around;box-shadow:var(--shadow)}.mobile-nav button{border:0;background:transparent;color:#DDEAF4;padding:7px;font-size:11px}.top-actions .btn:not(.primary){display:none}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const patients = [
 {name:"Maria Schmidt",age:82,station:"3B · Zimmer 12",reason:"11 % Gewichtsverlust · Aufnahme < 50 %",priority:"Hoch",score:95,icon:"👵"},
 {name:"Hans Becker",age:76,station:"2A · Zimmer 08",reason:"Refeeding-Risiko · Elektrolyte offen",priority:"Hoch",score:91,icon:"👴"},
 {name:"Eva Koch",age:69,station:"4C · Zimmer 21",reason:"Entlassung heute · Bericht offen",priority:"Mittel",score:78,icon:"👩"},
 {name:"Ali Demir",age:58,station:"2A · Zimmer 14",reason:"Screening ausstehend",priority:"Mittel",score:71,icon:"👨"},
 {name:"Lena Müller",age:73,station:"3B · Zimmer 17",reason:"Verlaufskontrolle fällig",priority:"Niedrig",score:54,icon:"👩‍🦳"}
];

function App(){
 const [page,setPage]=useState("today");
 const [modal,setModal]=useState(null);
 const [toast,setToast]=useState("");
 const [severity,setSeverity]=useState("Moderat");
 const [criteria,setCriteria]=useState({weight:"yes",bmi:"no",muscle:"unknown",intake:"yes",malabs:"unknown",inflam:"unknown"});
 const notify=(m)=>{setToast(m);setTimeout(()=>setToast(""),1800)};
 const goPatient=()=>setPage("patient");
 const nav=(id,label,icon)=><button className={"nav-btn "+(page===id?"active":"")} onClick={()=>setPage(id)}><span className="nav-icon">{icon}</span><span>{label}</span></button>;
 return <div className="app">
   <aside className="sidebar">
    <div className="brand"><div className="brandmark">N</div><div><b>NutriPilot</b><small>Pilot v0.3 · Erwachsene Station</small></div></div>
    {nav("today","Mein Tag","⌂")}
    {nav("patients","Patienten","👥")}<div className="nav-section">Screening & Diagnostik</div>{nav("nrs","NRS-2002","▣")}
    <div className="nav-section">Arbeitsbereich</div>
    {nav("patient","Patienten-Workspace","◎")}
    {nav("glim","GLIM-Assistent","✓")}
    {nav("plan","Maßnahmenplan","▤")}
    {nav("monitor","Monitoring","↗")}
    <div className="nav-section">Qualität & Wissen</div>
    {nav("quality","Qualitätsdashboard","⌁")}
    {nav("guidelines","Leitlinien","◫")}
    <div className="profile"><div className="avatar">LB</div><div><b>Laura Becker</b><small>Diätassistentin · Station 3B</small></div></div>
   </aside>
   <div className="shell">
    <header className="topbar">
      <div className="greeting"><h1>{page==="today"?"Guten Morgen, Laura 👋":"NutriPilot"}</h1><p>{page==="today"?"Montag, 3. August · Klinikum Beispielstadt":"Clinical Nutrition Workspace"}</p></div>
      <div className="top-actions"><input className="search" placeholder="Patient, Zimmer oder Aufgabe suchen …"/><button className="btn">🔔</button><button className="btn primary" onClick={()=>setModal("entry")}>＋ Neuer Eintrag</button></div>
    </header>
    <main className="content">
      <div className="clinical-banner">
        <div><b>Fachlich fundierter Konzeptprototyp – noch nicht klinisch validiert</b><small>Geltungsbereich: erwachsene, nicht intensivpflichtige stationäre Patienten. Die Anwendung unterstützt Fachkräfte und ersetzt weder Diagnose noch Therapieentscheidung.</small></div>
        <span className="source-chip">GLIM 2025 · NRS-2002 · DGEM</span>
      </div>
      {page==="today" && <Today goPatient={goPatient} setPage={setPage}/>}
      {page==="patients" && <Patients goPatient={goPatient}/>} {page==="nrs" && <NRS setPage={setPage}/>} 
      {page==="patient" && <PatientWorkspace setPage={setPage} setModal={setModal}/>}
      {page==="glim" && <GLIM criteria={criteria} setCriteria={setCriteria} severity={severity} setSeverity={setSeverity} setPage={setPage} setModal={setModal}/>}
      {page==="plan" && <Plan notify={notify}/>}
      {page==="monitor" && <Monitoring/>}
      {page==="quality" && <Quality/>}
      {page==="guidelines" && <Guidelines/>}
    </main>
   </div>
   <nav className="mobile-nav">
    <button onClick={()=>setPage("today")}>⌂<br/>Heute</button><button onClick={()=>setPage("patients")}>👥<br/>Patienten</button><button onClick={()=>setPage("patient")}>◎<br/>Workspace</button><button onClick={()=>setPage("quality")}>⌁<br/>Qualität</button>
   </nav>
   {modal && <Modal type={modal} close={()=>setModal(null)} notify={notify}/>}
   {toast && <div className="toast">{toast}</div>}
 </div>
}

function Today({goPatient,setPage}){
 return <div className="page">
  <div className="hero">
   <section className="card welcome">
    <h2>Mehr Versorgungsqualität trotz knapper Zeit.</h2>
    <p>NutriPilot strukturiert Screening, Assessment, GLIM-Bewertung, Maßnahmen und Verlauf – nachvollziehbar, quellenbasiert und immer unter fachlicher Kontrolle.</p>
    <div className="summary-row">
      <div className="summary-card"><strong>28</strong><small>Patienten im Zuständigkeitsbereich</small></div>
      <div className="summary-card"><strong style={{color:"var(--red)"}}>4</strong><small>hohe Priorität</small></div>
      <div className="summary-card"><strong style={{color:"var(--amber)"}}>6</strong><small>offene Screenings</small></div>
      <div className="summary-card"><strong style={{color:"var(--blue)"}}>3</strong><small>Berichte offen</small></div>
    </div>
   </section>
   <aside className="card copilot-card">
    <div className="card-head"><h3>✦ NutriPilot empfiehlt heute</h3><span className="badge purple">Copilot</span></div>
    <div className="card-body">
      <div className="copilot-item"><span className="rank">1</span><div><b>Maria Schmidt zuerst sehen</b><small>Gewichtsverlust, geringe Aufnahme, Refeeding-Check offen</small></div></div>
      <div className="copilot-item"><span className="rank">2</span><div><b>Hans Becker: Elektrolyte prüfen</b><small>Refeeding-Risiko noch nicht vollständig bewertet</small></div></div>
      <div className="copilot-item"><span className="rank">3</span><div><b>Entlassungsbericht vorbereiten</b><small>Eva Koch wird heute voraussichtlich entlassen</small></div></div>
      <button className="btn" style={{width:"100%",marginTop:12}} onClick={goPatient}>Arbeitstag starten →</button>
    </div>
   </aside>
  </div>
  <div className="grid-2">
   <section className="card">
    <div className="card-head"><h3>Priorisierte Patienten</h3><button className="btn soft" onClick={()=>setPage("patients")}>Alle anzeigen</button></div>
    <div className="card-body priority-list">{patients.slice(0,4).map((p,i)=><PatientRow key={i} p={p} onClick={goPatient}/>)}</div>
   </section>
   <aside className="card">
    <div className="card-head"><h3>Stationsfortschritt</h3><span className="badge green">Heute</span></div>
    <div className="card-body station-grid">
      <Station name="3B Geriatrie" value={94} text="17 von 18 gescreent"/>
      <Station name="2A Innere" value={88} text="21 von 24 gescreent"/>
      <Station name="4C Onkologie" value={100} text="11 von 11 gescreent"/>
      <Station name="5A Chirurgie" value={79} text="15 von 19 gescreent"/>
    </div>
   </aside>
  </div>
 </div>
}

function PatientRow({p,onClick}){return <div className="patient-row" onClick={onClick}>

function GLIM({criteria,setCriteria,severity,setSeverity,setPage,setModal}){
 const setState=(key,val)=>setCriteria({...criteria,[key]:val});
 const yes=k=>criteria[k]==="yes";
 const pheno=["weight","bmi","muscle"].filter(yes).length;
 const aetio=["intake","malabs","inflam"].filter(yes).length;
 const allComplete=Object.values(criteria).every(v=>v!=="unknown");

 // Demo patient, rule-based severity according to phenotypic criteria:
 // Weight loss 11% in 3 months => Stage 2 (severe), if diagnosis criteria are met.
 const diagnosis = pheno>=1 && aetio>=1;
 const autoStage = diagnosis ? "Stage 2 – schwere Mangelernährung" : "Keine GLIM-Einstufung";
 const missing = Object.entries(criteria).filter(([k,v])=>v==="unknown").map(([k])=>k);

 return <div className="page">
  <div className="card">
   <div className="card-head">
    <div><h3>GLIM Diagnose-Assistent</h3><small style={{color:"var(--muted)"}}>Schritt 2 nach positivem validiertem Risikoscreening. Alle fünf Kriterien werden beurteilt.</small></div>
    <button className="btn soft" onClick={()=>setPage("guidelines")}>Quellen & Regeln</button>
   </div>
   <div className="card-body">
    <div className="scope-card"><b>Voraussetzung:</b> Positives NRS-2002-Screening und vollständiges Ernährungsassessment. GLIM bestätigt Mangelernährung bei mindestens <b>1 phänotypischen + 1 ätiologischen Kriterium</b>.</div>
    <div className="criterion-grid" style={{marginTop:14}}>
     <StateBlock title="Phänotypische Kriterien" count={pheno}>
      <StateCriterion value={criteria.weight} setValue={v=>setState("weight",v)} title="Unbeabsichtigter Gewichtsverlust" note="11 % innerhalb von 3 Monaten" detail="Erfüllt; zugleich schwere Ausprägung (>10 % innerhalb 6 Monate)."/>
      <StateCriterion value={criteria.bmi} setValue={v=>setState("bmi",v)} title="Niedriger BMI" note="BMI 22,1 kg/m²; Alter 82 Jahre" detail="Nicht erfüllt: bei ≥70 Jahren gilt <22 kg/m²."/>
      <StateCriterion value={criteria.muscle} setValue={v=>setState("muscle",v)} title="Reduzierte Muskelmasse" note="Messmethode und Referenzwert erforderlich" detail="Nicht erhoben; keine automatische Bewertung ohne dokumentierte Methode."/>
     </StateBlock>
     <StateBlock title="Ätiologische Kriterien" count={aetio}>
      <StateCriterion value={criteria.intake} setValue={v=>setState("intake",v)} title="Reduzierte Nahrungsaufnahme" note="<50 % des Energiebedarfs seit 8 Tagen" detail="Erfüllt: <50 % für länger als 1 Woche."/>
      <StateCriterion value={criteria.malabs} setValue={v=>setState("malabs",v)} title="Beeinträchtigte Assimilation" note="Klinische Ursache und Dauer dokumentieren" detail="Aktuell nicht dokumentiert."/>
      <StateCriterion value={criteria.inflam} setValue={v=>setState("inflam",v)} title="Krankheitslast / Entzündung" note="Klinische Einordnung; Labor nur unterstützend" detail="Nicht allein aus einem erhöhten CRP ableiten."/>
     </StateBlock>
    </div>

    <div className="result">
      <div>
        <h3>{diagnosis?"GLIM-Systematik erfüllt":"GLIM-Systematik noch nicht erfüllt"}</h3>
        <p>{diagnosis
          ? "Mindestens ein phänotypisches und ein ätiologisches Kriterium sind erfüllt. Die Fachkraft muss Diagnose und Kontext bestätigen."
          : "Für die GLIM-Diagnose fehlt noch mindestens ein erforderliches Kriterium."}</p>
        {!allComplete && <p style={{marginTop:7}}><b>Offene Datenerhebung:</b> {missing.length} Kriterium/Kriterien noch nicht vollständig beurteilt.</p>}
      </div>
      <div>
        <small>Automatisch aus phänotypischen Kriterien abgeleiteter Schweregrad</small>
        <div style={{marginTop:8,padding:"10px 12px",borderRadius:10,background:"#fff",fontWeight:800,color:diagnosis?"#B54E30":"#697386"}}>{autoStage}</div>
        <small style={{display:"block",marginTop:7}}>Nicht frei auswählbar. Fachliche Bestätigung oder begründete Korrektur erforderlich.</small>
      </div>
    </div>

    <div className="rule-box">
      <b>Warum dieses Ergebnis?</b><br/>
      <code>PHENO_WEIGHT_LOSS = erfüllt</code> (11 % / 3 Monate) + <code>ETIO_REDUCED_INTAKE = erfüllt</code> (&lt;50 % / 8 Tage).<br/>
      Schweregrad: stärkste phänotypische Ausprägung = Gewichtsverlust &gt;10 % innerhalb von 6 Monaten → Stage 2.
    </div>

    <div style={{marginTop:14,display:"flex",gap:9,flexWrap:"wrap"}}>
      <button className="btn primary" onClick={()=>setPage("plan")}>Fachlich bestätigen & Maßnahmen planen</button>
      <button className="btn" onClick={()=>setModal("report")}>Dokumentationsentwurf</button>
    </div>
   </div>
  </div>
 </div>
}
